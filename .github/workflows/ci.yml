name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pricehunter
          POSTGRES_PASSWORD: pricehunter
          POSTGRES_DB: pricehunter
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pricehunter:pricehunter@localhost:5432/pricehunter
      SESSION_SECRET: secret-de-test-ci-0000000000000000000000aa

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installation des dépendances
        run: npm install

      - name: Prisma client
        run: npx prisma generate

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Tests unitaires (Vitest)
        run: npm test

      - name: Build Next.js
        run: npm run build

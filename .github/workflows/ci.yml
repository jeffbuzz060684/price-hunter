name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pricehunter
          POSTGRES_PASSWORD: pricehunter
          POSTGRES_DB: pricehunter
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pricehunter:pricehunter@localhost:5432/pricehunter
      SESSION_SECRET: secret-de-test-ci-0000000000000000000000aa

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installation des dépendances
        run: npm install

      - name: Prisma client
        run: npx prisma generate

      - name: Diagnostic en cas d'échec
        if: failure()
        run: |
          {
            echo "== node =="; node --version
            echo "== npm ls =="; npm ls prisma @prisma/client 2>&1 || true
            echo "== prisma --version =="; npx prisma --version 2>&1 || true
            echo "== prisma validate =="; npx prisma validate 2>&1 || true
            echo "== prisma generate =="; npx prisma generate 2>&1 || true
          } > diagnostic.txt
          git config user.name "ci-diagnostic"
          git config user.email "ci-diagnostic@users.noreply.github.com"
          git checkout -B ci-diagnostic
          git add diagnostic.txt
          git commit -m "Diagnostic CI"
          git push origin ci-diagnostic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Tests unitaires (Vitest)
        run: npm test

      - name: Build Next.js
        run: npm run build
